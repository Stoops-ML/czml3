name: Publish to PyPi

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Check the release tag matches the project version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        tag="${RELEASE_TAG#v}"
        version=$(uv version --short)
        if [ "$tag" != "$version" ]; then
          echo "::error::release tag $RELEASE_TAG does not match project.version ($version)"
          exit 1
        fi
        echo "release tag $RELEASE_TAG matches project.version"
    - name: Build a binary wheel and a source tarball
      run: uv build --no-sources
    - name: Check the distribution metadata
      run: uvx twine check dist/*
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/czml3
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

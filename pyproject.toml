[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "czml3"
version = "3.3.1"
authors = [
    {name = "Daniel Stoops", email = "danielstoops25@gmail.com"},
    {name = "Juan Luis Cano Rodríguez", email = "hello@juanlu.space"},
]
description = "Python 3 library to write CZML"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["czml", "cesium"]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.10.1",
    "python-dateutil>=2.7,<3",
    "typing-extensions>=4.12.0",
    "StrEnum>=0.4.0",
    "numpy",
]

[project.urls]
Repository = "https://github.com/Stoops-ML/czml3"
Documentation = "https://czml3.readthedocs.io/en"

[dependency-groups]
dev = [
    "build",
    "mypy>=1.16.1",
    "pytest",
    "pytest-cov",
    "pytest-mypy",
    "ruff",
    "types-python-dateutil",
]

[tool.setuptools.package-data]
"czml3" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "browser: renders the HTML preview in a headless browser (needs Chrome and internet)",
]

[tool.coverage.run]
branch = true
source = ["czml3"]

[tool.mypy]
files = [
    "src/**/*.py",
    "tests/**/*.py",
]
warn_redundant_casts = true
warn_unused_configs = true
pretty = true
show_error_codes = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

# More strict checks for library code
[[tool.mypy.overrides]]
module = "czml3.*"
disallow_untyped_defs = true

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "C","W","B9"
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
